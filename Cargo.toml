[workspace]
resolver = "2"
members = [
    "core",
    "service",
    "cli",
    "notifier",
    "src-tauri",
]

[workspace.package]
rust-version = "1.77.2"

[patch.crates-io]
# riperf3 0.5 uses Option::is_none_or (stabilized after our Win7 compiler).
# Keep the published API and patch only that compatibility call locally.
riperf3 = { path = "vendor/riperf3" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
incremental = false
debug = 0
