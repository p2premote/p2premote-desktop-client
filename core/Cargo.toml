[package]
name = "p2premote-core"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
build = "build.rs"

[dependencies]
# 源码集成（社区标准做法：单一 Rust 世界，无 staticlib 符号冲突）：
# 打洞库直接以 path 依赖编译进客户端，全平台（Linux/Windows/macOS）同一路径，
# musl 静态目标由客户端构建统一保证。
p2premote-punch = { path = "../../p2premote-punch-rs", default-features = false }
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
base64 = "0.22"
encoding_rs = "0.8"
futures-util = "0.3"
hostname = "0.4"
ipnet = "2"
json5 = "0.4"
local-ip-address = "0.6"
network-interface = "2"
once_cell = "1"
parking_lot = "0.12"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "socks"], default-features = false }
riperf3 = "=0.8.0"
rustls = { version = "0.23", features = ["ring"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
bytes = "1"
tokio-tungstenite = { version = "0.26", features = ["connect", "rustls-tls-webpki-roots"], default-features = false }
tracing = "0.1"
tracing-subscriber = "0.3"
time = { version = "0.3", features = ["local-offset"] }
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
wait-timeout = "0.2"
x25519-dalek = { version = "2", features = ["static_secrets"] }

[target.'cfg(not(windows))'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-service = "0.7"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_SystemInformation"] }
wmi = { version = "=0.14.0", default-features = false }
