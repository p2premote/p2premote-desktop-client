[package]
name = "p2premote-core"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
aes-gcm = "0.10"
base64 = "0.22"
encoding_rs = "0.8"
futures-util = "0.3"
hostname = "0.4"
json5 = "0.4"
local-ip-address = "0.6"
once_cell = "1"
parking_lot = "0.12"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "socks"], default-features = false }
riperf3 = "0.8"
rustls = { version = "0.23", features = ["aws-lc-rs"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
bytes = "1"
tokio-tungstenite = { version = "0.26", features = ["connect", "rustls-tls-webpki-roots"], default-features = false }
tracing = "0.1"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
wait-timeout = "0.2"
x25519-dalek = { version = "2", features = ["static_secrets"] }

[target.'cfg(not(windows))'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-service = "0.7"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Memory", "Win32_System_RemoteDesktop", "Win32_System_SystemInformation", "Win32_System_Threading"] }
