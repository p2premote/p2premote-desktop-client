[package]
name = "p2premote"
version = "1.13.7"
description = "P2P Remote Desktop Client - Tauri Version"
authors = ["p2premote"]
edition = "2021"
rust-version.workspace = true

[lib]
name = "p2premote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "=1.5.6", features = [] }

[dependencies]
tauri = { version = "=1.8.3", features = ["dialog-save", "shell-open", "system-tray", "window-all"] }
tauri-plugin-single-instance = { git = "https://github.com/tauri-apps/plugins-workspace", rev = "1e407ed56455558cf751022fd68eca3b9e3713a0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono"] }
chrono = "0.4"
once_cell = "1"
parking_lot = "0.12"
p2premote-core = { path = "../core" }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
image = { version = "0.24.9", default-features = false, features = ["png"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_RemoteDesktop", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
